<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>找自己</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="intro-view" class="view intro-view">
        <div class="eyebrow">FIND YOURSELF</div>
        <h1>找自己</h1>
        <p class="lead">
          从你的愿望和才能里找出可能的方向，再用你真正重视的东西筛选它们。
        </p>
        <button id="start-button" class="primary-button">点这里，一起找到自己</button>
        <button id="resume-button" class="secondary-button hidden">查看上次结果</button>
        <p class="microcopy">16 个问题 · 约 10 分钟 · 结果保存在你的浏览器里</p>
      </section>

      <section id="question-view" class="view hidden">
        <header class="question-header">
          <button id="back-button" class="text-button">← 返回</button>
          <div class="progress-copy"><span id="question-number">1</span> / 16</div>
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        </header>
        <div class="question-area">
          <div id="category-label" class="eyebrow">价值观</div>
          <div class="question-title-row">
            <h2 id="question-title"></h2>
            <button id="question-help-button" class="help-button" aria-expanded="false" aria-controls="question-help">?</button>
          </div>
          <p id="question-hint" class="question-hint"></p>
          <div id="question-help" class="help-panel hidden"></div>
          <textarea id="answer-input" rows="7" placeholder="写下你真实想到的内容，不用组织得很完美"></textarea>
          <div class="question-actions">
            <button id="skip-button" class="text-button">暂时跳过</button>
            <button id="next-button" class="primary-button">下一题 →</button>
          </div>
        </div>
      </section>

      <section id="results-view" class="view hidden">
        <div class="eyebrow">FIND YOURSELF</div>
        <h1>一起把方向找出来</h1>
        <p class="lead result-lead">
          先看愿望和才能的交集，再用价值观筛选职业和人生方向。每一步都可以修改。
        </p>
        <nav id="results-nav" class="results-nav" aria-label="结果页面">
          <button class="results-tab active" data-page="0">1 整理自己</button>
          <button class="results-tab" data-page="1">2 选择方向</button>
          <button class="results-tab" data-page="2">3 比对价值观</button>
        </nav>
        <div id="result-content"></div>
        <div class="result-actions">
          <button id="restart-button" class="secondary-button">重新探索</button>
          <button id="view-answers-button" class="secondary-button">查看我的回答</button>
          <button id="copy-button" class="primary-button">复制我的结果</button>
          <button id="download-button" class="secondary-button">下载结果</button>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
